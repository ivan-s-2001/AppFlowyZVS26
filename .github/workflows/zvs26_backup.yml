name: ZVS-26 daily rolling backup

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zvs26-rolling-backup
  cancel-in-progress: false

jobs:
  rolling-backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout application
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check backup configuration
        id: config
        env:
          BACKUP_URL: ${{ secrets.ZVS26_BACKUP_URL }}
          BACKUP_TOKEN: ${{ secrets.ZVS26_BACKUP_TOKEN }}
          BACKUP_PASSWORD: ${{ secrets.ZVS26_BACKUP_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$BACKUP_URL" || -z "$BACKUP_TOKEN" || -z "$BACKUP_PASSWORD" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ZVS-26 backup is not configured yet. Add ZVS26_BACKUP_URL, ZVS26_BACKUP_TOKEN and ZVS26_BACKUP_PASSWORD."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Export full knowledge base
        if: steps.config.outputs.enabled == 'true'
        env:
          ZVS26_BACKUP_URL: ${{ secrets.ZVS26_BACKUP_URL }}
          ZVS26_BACKUP_TOKEN: ${{ secrets.ZVS26_BACKUP_TOKEN }}
        run: bash tools/zvs26_backup/export.sh /tmp/zvs26-latest.tar.gz

      - name: Encrypt snapshot
        if: steps.config.outputs.enabled == 'true'
        env:
          BACKUP_PASSWORD: ${{ secrets.ZVS26_BACKUP_PASSWORD }}
        shell: bash
        run: |
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 250000 \
            -in /tmp/zvs26-latest.tar.gz \
            -out /tmp/zvs26-latest.tar.gz.enc \
            -pass env:BACKUP_PASSWORD

          sha256sum /tmp/zvs26-latest.tar.gz.enc | awk '{print $1}' > /tmp/zvs26-latest.sha256
          printf '{"created_at":"%s","format":"tar.gz+aes-256-cbc","kdf":"PBKDF2","iterations":250000}\n' \
            "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > /tmp/metadata.json

          rm -f /tmp/zvs26-latest.tar.gz

      - name: Replace backup branch
        if: steps.config.outputs.enabled == 'true'
        shell: bash
        run: |
          git config user.name "zvs26-backup-bot"
          git config user.email "actions@users.noreply.github.com"

          git checkout --orphan __zvs26_backup
          git rm -rf . >/dev/null 2>&1 || true

          mkdir -p backup
          cp /tmp/zvs26-latest.tar.gz.enc backup/zvs26-latest.tar.gz.enc
          cp /tmp/zvs26-latest.sha256 backup/zvs26-latest.sha256
          cp /tmp/metadata.json backup/metadata.json

          cat > backup/README.md <<'EOF'
          # ZVS-26 rolling backup

          Эта ветка содержит только последнюю зашифрованную резервную копию базы знаний.

          Старый commit заменяется force-push'ем при каждом успешном ежедневном бэкапе.
          Для расшифровки нужен секрет ZVS26_BACKUP_PASSWORD.
          EOF

          git add backup
          git commit -m "backup: replace latest ZVS-26 snapshot"
          git push origin HEAD:backup --force
